name: Publish private demo runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: acrdefenderdemo01.azurecr.io/ghas-octodemo-nestle:runtime-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build a single Linux/amd64 image
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" runtime
          container=$(docker run --detach --read-only --cap-drop=ALL --security-opt=no-new-privileges "$IMAGE")
          trap 'docker rm --force "$container" >/dev/null' EXIT
          for attempt in {1..10}; do
            if docker exec "$container" /demo health; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.ACR_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to ACR
        run: |
          az acr login --name acrdefenderdemo01
          docker push "$IMAGE"
          docker buildx imagetools inspect --raw "$IMAGE" | jq -e 'has("config") and (has("manifests") | not)'
