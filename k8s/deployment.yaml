apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghas-octodemo-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ghas-octodemo-cluster-admin-binding
subjects:
  - kind: ServiceAccount
    name: ghas-octodemo-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghas-octodemo-nestle
  namespace: default
  labels:
    app: ghas-octodemo-nestle
    demo: nestle-code-to-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghas-octodemo-nestle
  template:
    metadata:
      labels:
        app: ghas-octodemo-nestle
        demo: nestle-code-to-cloud
    spec:
      serviceAccountName: ghas-octodemo-sa
      containers:
        - name: ghas-octodemo-nestle
          image: __ACR_LOGIN_SERVER__/ghas-octodemo-nestle:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Service
metadata:
  name: ghas-octodemo-nestle
  namespace: default
  labels:
    app: ghas-octodemo-nestle
    demo: nestle-code-to-cloud
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: ghas-octodemo-nestle
