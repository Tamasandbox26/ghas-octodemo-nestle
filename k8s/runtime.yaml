apiVersion: v1
kind: Namespace
metadata:
  name: nestle-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghas-octodemo-nestle
  namespace: nestle-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghas-octodemo-nestle
  template:
    metadata:
      labels:
        app: ghas-octodemo-nestle
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: __RUNTIME_IMAGE_BY_DIGEST__
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            exec:
              command: ["/demo", "health"]
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["/demo", "health"]
            timeoutSeconds: 2
